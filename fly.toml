# Fly.io deployment config for grimoire (SvelteKit + SQLite).
#
# Do NOT use `fly launch` here — it would try to scaffold its own
# Dockerfile via @flydotio/dockerfile (which has been flaky), but this
# repo ships a working Dockerfile already. Use `fly deploy` directly.
#
# One-time setup:
#   fly apps create grimoire                      # or pick a new name + edit `app` below
#   fly volumes create grimoire_data --size 3 --region iad
#   fly secrets set \
#     ORIGIN=https://<your-app>.fly.dev \
#     ADMIN_USERNAME=narfman0 \
#     RESEND_API_KEY=... \
#     SENTRY_DSN=...
#   fly deploy
#
# Subsequent deploys: `fly deploy` (uses ./Dockerfile + this fly.toml).

app            = "grimoire"
primary_region = "iad"

[build]

[env]
  NODE_ENV     = "production"
  DATABASE_URL = "/data/grimoire.db"
  # ORIGIN and ADMIN_USERNAME must be set via: fly secrets set ...

[http_service]
  internal_port        = 3000
  force_https          = true
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  # Set to 1 to keep the machine warm (uses ~1 of your 3 free VMs).
  # Set to 0 for zero-cost idle with ~3s cold starts.
  min_machines_running = 1

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    grace_period = "15s"
    interval     = "30s"
    method       = "GET"
    path         = "/api/health"
    timeout      = "5s"

[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
  cpus     = 1

[[mounts]]
  source      = "grimoire_data"
  destination = "/data"

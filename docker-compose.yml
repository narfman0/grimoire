services:
  # web — SvelteKit (adapter-node) at :3000. Runs drizzle migrations on
  # boot, then serves the app. Shares the sqlite file with `sync` via
  # the named volume below.
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: grimoire-web:latest
    container_name: grimoire-web
    restart: unless-stopped
    ports:
      - "${GRIMOIRE_PORT:-49300}:3000"
    environment:
      DATABASE_URL: /data/grimoire.db
      NODE_ENV: production
    volumes:
      - grimoire-data:/data

  # sync — Hocuspocus websocket broker at :1234. Persists Y.Doc state
  # into the same sqlite file via the shared volume.
  sync:
    build:
      context: .
      dockerfile: Dockerfile
      target: sync
    image: grimoire-sync:latest
    container_name: grimoire-sync
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${GRIMOIRE_SYNC_PORT:-49301}:1234"
    environment:
      DATABASE_URL: /data/grimoire.db
      SYNC_PORT: "1234"
    volumes:
      - grimoire-data:/data

volumes:
  grimoire-data:

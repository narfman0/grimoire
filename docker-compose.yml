services:
  # web — SvelteKit (adapter-node) at :3000. Runs drizzle migrations on
  # boot, then serves the app. Live updates flow through SSE on the same
  # HTTP port; no separate sync process needed.
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: grimoire-web:latest
    container_name: grimoire-web
    restart: unless-stopped
    ports:
      - "${GRIMOIRE_PORT:-49300}:3000"
    environment:
      DATABASE_URL: /data/grimoire.db
      NODE_ENV: production
      # Required: public URL for CSRF origin check (e.g. https://grimoire.example.com)
      ORIGIN: ${ORIGIN}
      # Optional: username to bootstrap as admin (default: narfman0)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-narfman0}
    volumes:
      - grimoire-data:/data

volumes:
  grimoire-data:

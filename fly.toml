# fly.toml app configuration file generated for grimoire-wispy-fog-2051 on 2026-05-20T23:45:42-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'grimoire-wispy-fog-2051'
primary_region = 'iad'

[build]

[env]
  DATABASE_URL = '/data/grimoire.db'
  NODE_ENV = 'production'

[[mounts]]
  source = 'grimoire_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256

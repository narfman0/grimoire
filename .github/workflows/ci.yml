name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  deploy:
    # Only on master pushes (skips PRs and feature-branch CI runs); needs:ci
    # gates on the type-check + test + build jobs above so red CI never
    # ships. concurrency: drops in-flight deploys when a newer push lands
    # so a fast string of merges doesn't pile up on Fly.
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-grimoire
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly
        run: flyctl deploy --remote-only --app grimoire-wispy-fog-2051
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

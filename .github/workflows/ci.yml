name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    # Playwright smoke suite: two browser clients on one live encounter
    # (realtime poll sync + reveals redaction) plus auth + character sheet.
    # Runs against a throwaway sqlite DB (see playwright.config.ts).
    #
    # Promoted to a deploy gate 2026-07-29 (deploy needs: [ci, e2e]). It
    # earned it: this suite caught the action-log redaction leak, the
    # table-mode redaction path, and several real regressions during the
    # WS2 build-out. Its failures are load-bearing now, not advisory.
    #
    # Note the failure mode to watch is locator collisions, not flakes —
    # new UI text repeatedly broke loose getByText/getByRole locators in
    # existing specs. That is the suite doing its job; tighten the
    # locator (exact: true, or scope to a container) rather than retrying.
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: E2E smoke suite
        run: pnpm test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    # Only on master pushes (skips PRs and feature-branch CI runs). Gates on
    # both the type-check + test + build job and the Playwright suite, so
    # neither a red unit run nor a broken two-client encounter flow can
    # ship. concurrency: drops in-flight deploys when a newer push lands so
    # a fast string of merges doesn't pile up on Fly.
    needs: [ci, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-grimoire
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly
        run: flyctl deploy --remote-only --app grimoire-wispy-fog-2051
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

allowBuilds:
  '@sentry/cli': true
# Explicit allowlist for postinstall scripts. pnpm@11 hides these by
# default; we opt in to the ones that need to run native builds or
# generate preprocessors.
onlyBuiltDependencies:
  - '@sentry/cli'
  - better-sqlite3
  - esbuild
  - sqlite3
  - svelte-preprocess

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          # Matches the Dockerfile base and @types/node, so CI compiles
          # better-sqlite3 against the same ABI prod will run and fails here
          # rather than at deploy time. Fly builds the image remotely, so a
          # native-module break would otherwise first surface as a failed
          # deploy.
          node-version: 26
          # Explicit on purpose. setup-node v6 stopped enabling pnpm/yarn
          # caching automatically (it now only auto-caches npm), but an
          # explicit `cache` input still works — and pnpm/action-setup must
          # stay ahead of this step so the binary is on PATH when it runs.
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    # Playwright smoke suite: two browser clients on one live encounter
    # (realtime poll sync + reveals redaction) plus auth + character sheet.
    # Runs against a throwaway sqlite DB (see playwright.config.ts).
    #
    # Promoted to a deploy gate 2026-07-29 (deploy needs: [ci, e2e, docker]). It
    # earned it: this suite caught the action-log redaction leak, the
    # table-mode redaction path, and several real regressions during the
    # WS2 build-out. Its failures are load-bearing now, not advisory.
    #
    # Note the failure mode to watch is locator collisions, not flakes —
    # new UI text repeatedly broke loose getByText/getByRole locators in
    # existing specs. That is the suite doing its job; tighten the
    # locator (exact: true, or scope to a container) rather than retrying.
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          # Matches the Dockerfile base and @types/node, so CI compiles
          # better-sqlite3 against the same ABI prod will run and fails here
          # rather than at deploy time. Fly builds the image remotely, so a
          # native-module break would otherwise first surface as a failed
          # deploy.
          node-version: 26
          # Explicit on purpose. setup-node v6 stopped enabling pnpm/yarn
          # caching automatically (it now only auto-caches npm), but an
          # explicit `cache` input still works — and pnpm/action-setup must
          # stay ahead of this step so the binary is on PATH when it runs.
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: E2E smoke suite
        run: pnpm test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  docker:
    # Builds the production image — the only job that exercises the
    # Dockerfile at all.
    #
    # Added after a Node 26 base bump passed `ci` and `e2e` and then failed
    # the Fly deploy with `corepack: not found` (corepack was removed from
    # official Node distributions in Node 25). Nothing in CI touched the
    # image: CI installs pnpm through pnpm/action-setup, the Dockerfile did
    # it through corepack, and the gap between those two paths is where the
    # break lived. Every Dockerfile or base-image change was a coin flip
    # discovered at deploy time.
    #
    # Deliberately does not push. Fly builds its own image on deploy
    # (`flyctl deploy --remote-only`), so this is a *check*, not an
    # artifact — building is the whole assertion. The GHA layer cache keeps
    # repeat runs cheap; the expensive parts are the better-sqlite3 native
    # compile and `pnpm build`, both of which are exactly what we want
    # verified.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: grimoire:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Only on master pushes (skips PRs and feature-branch CI runs). Gates on
    # the type-check + test + build job, the Playwright suite, and the image
    # build — so neither a red unit run, a broken two-client encounter flow,
    # nor a Dockerfile that won't build can ship. concurrency: drops
    # in-flight deploys when a newer push lands so a fast string of merges
    # doesn't pile up on Fly.
    needs: [ci, e2e, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-grimoire
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly
        run: flyctl deploy --remote-only --app grimoire-wispy-fog-2051
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
